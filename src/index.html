<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixabay Search with Pagination</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/simplelightbox/2.14.2/simple-lightbox.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/izitoast/dist/css/iziToast.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <form class="search-form" id="search-form">
        <input type="text" name="query" placeholder="Search images..." required />
        <button type="submit">Search</button>
    </form>

    <ul class="gallery" id="gallery"></ul>
    <div class="loader" id="loader" style="display: none;">Loading...</div>
    <button type="button" class="load-more" id="load-more" style="display: none;">Load more</button>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplelightbox/2.14.2/simple-lightbox.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/izitoast/dist/js/iziToast.min.js"></script>
    <script src="main.js" type="module"></script>
</body>
</html>
