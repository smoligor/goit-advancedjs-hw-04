<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixabay Search with Pagination</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <form class="search-form" id="search-form">
      <input type="text" name="query" placeholder="Search images..." required />
      <button type="submit">Search</button>
    </form>

    <ul class="gallery" id="gallery"></ul>
    <div class="loader" id="loader" style="display: none">Loading...</div>
    <button type="button" class="load-more" id="load-more" style="display: none"
      >Load more</button
    >

    <script src="./main.js" type="module"></script>
  </body>
</html>
